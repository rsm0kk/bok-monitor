<style>

.figs{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.fig{border:1px solid var(--line-soft);border-radius:8px;padding:8px;background:var(--panel-2);font-size:12px}
.fig img{width:100%;height:150px;object-fit:contain;background:#fff;border-radius:4px;display:block;margin-bottom:6px}
.fig .t{font-weight:600;color:var(--ink);line-height:1.3}
.fig .p{color:var(--ink-3)}
.dl{font-size:11px}
footer{color:var(--ink-3);font-size:12px;padding:16px 0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.two>*{min-width:0}@media(max-width:700px){.two{grid-template-columns:1fr}}

<header class="hero"><div class="wrap">

<script>
const DATA = __DATA__;
const NOTES = __NOTES__;
</script>
<script>
'use strict';
const B = DATA.bok, E = DATA.exports, X = DATA.ecos, N = NOTES;
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => [...(r || document).querySelectorAll(s)];
const C = { blue: '#175cd3', red: '#b42318', green: '#027a48', orange: '#b54708', purple: '#6941c6', teal: '#0e7490', gray: '#667085', pink: '#c11574', navy: '#3b5b8c', gold: '#854f0b', lblue: '#7cb3f5', lred: '#f0a29b' };
function fmt(v, d = 1) { if (v == null || !isFinite(v)) return '—'; return Number(v).toLocaleString('ko-KR', { minimumFractionDigits: d, maximumFractionDigits: d }); }
function sgn(v, d = 1) { if (v == null || !isFinite(v)) return '—'; return (v > 0 ? '+' : v < 0 ? '−' : '') + fmt(Math.abs(v), d); }
const tone = (v) => v > 0 ? 'pos' : v < 0 ? 'neg' : '';
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const last = (arr) => { for (let i = arr.length - 1; i >= 0; i--) if (arr[i] != null) return { i, v: arr[i] }; return null; };
const mean = (a) => { const b = a.filter((v) => v != null && isFinite(v)); return b.length ? b.reduce((s, v) => s + v, 0) / b.length : null; };
const median = (a) => { const b = a.filter((v) => v != null && isFinite(v)).sort((x, y) => x - y); if (!b.length) return null; const m = b.length >> 1; return b.length % 2 ? b[m] : (b[m - 1] + b[m]) / 2; };
function xlab(s, short) {
  if (!s) return ''; let m;
  if ((m = s.match(/^(\d{4})-(\d{2})-(\d{2})$/))) return short ? `${m[1].slice(2)}.${+m[2]}.${+m[3]}` : `${m[1]}-${m[2]}-${m[3]}`;
  if ((m = s.match(/^(\d{4})-(\d{2})(.*)$/))) return `${m[1].slice(2)}.${+m[2]}${m[3].includes('E') ? '(E)' : ''}`;
  if ((m = s.match(/^(\d{4})Q(\d)$/))) return `${m[1].slice(2)}.${m[2]}Q`;
  if ((m = s.match(/^(\d{4})H(\d)$/))) return `${m[1].slice(2)}.${m[2] === '1' ? '상' : '하'}`;
  return s;
}
const tip = $('#tip');
function showTip(x, y, html) {
  tip.innerHTML = html; tip.style.display = 'block';
  const r = tip.getBoundingClientRect(); let L = x + 14, T = y + 14;
  if (L + r.width > innerWidth - 8) L = x - r.width - 14; if (T + r.height > innerHeight - 8) T = y - r.height - 14;
  tip.style.left = Math.max(4, L) + 'px'; tip.style.top = Math.max(4, T) + 'px';
}
function hideTip() { tip.style.display = 'none'; }
function ticks(lo, hi, n = 5) {
  const span = (hi - lo) || 1, raw = span / n, p = Math.pow(10, Math.floor(Math.log10(raw))), f = raw / p;
  const step = (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * p;
  const out = []; for (let v = Math.ceil(lo / step) * step; v <= hi + 1e-9; v += step) out.push(+v.toFixed(10));
  return { step, out };
}
const dec = (step) => step >= 1 ? 0 : step >= 0.1 ? 1 : 2;
function csvDownload(name, x, series) {
  const rows = [['기간', ...series.map((s) => s.label + (s.unit ? ` (${s.unit})` : ''))]];
  x.forEach((d, i) => rows.push([d, ...series.map((s) => s.values[i] == null ? '' : s.values[i])]));
  const blob = new Blob(['﻿' + rows.map((r) => r.join(',')).join('\n')], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name + '.csv'; document.body.appendChild(a); a.click(); a.remove();
}

/* ───────── 차트 엔진: 선·막대(누적/그룹)·전망 음영·ECOS 연장(점선)·호버 툴팁 ───────── */
const REG = new Map(); // host → redraw
function chart(host, cfg) {
  REG.set(host, () => chart(host, cfg));
  const ser = cfg.series.filter((s) => s.values && s.values.length);
  cfg._hidden = cfg._hidden || new Set();
  const vis = ser.filter((s) => !cfg._hidden.has(s.label));
  const n = cfg.x.length;
  const hostW = host.clientWidth || host.parentElement.clientWidth || 640;
  const W = Math.max(cfg.minWidth || 460, hostW - 2), H = cfg.height || 230;
  const m = { t: 14, r: 14, b: 30, l: cfg.left || 52 };
  const pw = W - m.l - m.r, ph = H - m.t - m.b;
  const hasBar = vis.some((s) => s.type === 'bar');
  const barSer = vis.filter((s) => s.type === 'bar');
  // 값 범위 (누적이면 합계 기준)
  let vals = [];
  if (cfg.stacked && barSer.length) {
    for (let i = 0; i < n; i++) { let p = 0, q = 0; for (const s of barSer) { const v = s.values[i]; if (v == null) continue; if (v >= 0) p += v; else q += v; } vals.push(p, q); }
    vis.filter((s) => s.type !== 'bar').forEach((s) => vals.push(...s.values.filter((v) => v != null)));
  } else vals = vis.flatMap((s) => s.values).filter((v) => v != null && isFinite(v));
  if (cfg.zero || hasBar) vals.push(0);
  (cfg.refs || []).forEach((r) => vals.push(r.y));
  if (!vals.length) { host.innerHTML = '<div class="empty">데이터 없음</div>'; return; }
  let lo = Math.min(...vals), hi = Math.max(...vals); if (lo === hi) { lo -= 1; hi += 1; }
  const pad = (hi - lo) * 0.07; if (!(hasBar && lo === 0)) lo -= pad; hi += pad;
  if (cfg.min != null) lo = cfg.min; if (cfg.max != null) hi = cfg.max;
  const tk = ticks(lo, hi, cfg.yTicks || 5), d0 = cfg.dec != null ? cfg.dec : dec(tk.step);
  const slot = pw / Math.max(n, 1);
  const xs = (i) => hasBar ? m.l + slot * (i + 0.5) : (n > 1 ? m.l + i * pw / (n - 1) : m.l + pw / 2);
  const ys = (v) => m.t + (hi - v) / (hi - lo) * ph;
  let g = '';
  const dAx = dec(tk.step); // 축 눈금 자릿수는 눈금 간격으로 정한다(툴팁 자릿수와 별개)
  for (const t of tk.out) { const y = ys(t); g += `<line class="grid" x1="${m.l}" x2="${W - m.r}" y1="${y.toFixed(1)}" y2="${y.toFixed(1)}"/><text class="ax" x="${m.l - 6}" y="${(y + 4).toFixed(1)}" text-anchor="end">${fmt(t, dAx)}</text>`; }
  if (lo < 0 && hi > 0) g += `<line class="zero" x1="${m.l}" x2="${W - m.r}" y1="${ys(0).toFixed(1)}" y2="${ys(0).toFixed(1)}"/>`;
  if (cfg.shadeFrom != null && cfg.shadeFrom < n) { const x0 = hasBar ? m.l + slot * cfg.shadeFrom : xs(cfg.shadeFrom); g += `<rect class="shade" x="${x0.toFixed(1)}" y="${m.t}" width="${(W - m.r - x0).toFixed(1)}" height="${ph}"/>`; }
  // x 축 라벨: 46px 간격 확보, 겹치면 건너뛴다
  let lastX = -1e9; const want = Math.max(2, Math.floor(pw / 64)), every = Math.max(1, Math.ceil(n / want));
  for (let i = 0; i < n; i += every) {
    const x = xs(i), lab = cfg.xfmt ? cfg.xfmt(cfg.x[i]) : xlab(cfg.x[i], true);
    const w = lab.length * 6.5; let anchor = 'middle', ax = x;
    if (x - w / 2 < m.l - 4) { anchor = 'start'; ax = Math.max(x - w / 2, m.l - 4); }
    if (x + w / 2 > W - m.r + 4) { anchor = 'end'; ax = Math.min(x + w / 2, W - m.r + 4); }
    const left = anchor === 'start' ? ax : anchor === 'end' ? ax - w : ax - w / 2;
    if (left < lastX + 10) continue; lastX = left + w;
    g += `<text class="ax" x="${ax.toFixed(1)}" y="${H - 9}" text-anchor="${anchor}">${esc(lab)}</text>`;
  }
  for (const r of cfg.refs || []) { const y = ys(r.y); g += `<line class="ref" x1="${m.l}" x2="${W - m.r}" y1="${y.toFixed(1)}" y2="${y.toFixed(1)}"/><text class="ax ref-l" x="${W - m.r}" y="${(y - 4).toFixed(1)}" text-anchor="end">${esc(r.label)}</text>`; }
  for (const v of cfg.vlines || []) {
    if (v.i == null || v.i < 0 || v.i >= n) continue; const x = xs(v.i);
    const lw = v.label.length * 6.5; const flip = x + 4 + lw > W - m.r; // 오른쪽 끝에 붙으면 라벨을 왼쪽으로
    g += `<line class="vl" x1="${x.toFixed(1)}" x2="${x.toFixed(1)}" y1="${m.t}" y2="${m.t + ph}"/><text class="ax vl-l" x="${(flip ? x - 4 : x + 4).toFixed(1)}" y="${m.t + 10}" text-anchor="${flip ? 'end' : 'start'}">${esc(v.label)}</text>`;
  }
  // 막대
  if (barSer.length) {
    const bw = slot * 0.72, k = cfg.stacked ? 1 : barSer.length, ew = bw / k;
    for (let i = 0; i < n; i++) {
      let pos = 0, neg = 0;
      barSer.forEach((s, j) => {
        const v = s.values[i]; if (v == null) return;
        let y0, y1;
        if (cfg.stacked) { if (v >= 0) { y0 = ys(pos + v); y1 = ys(pos); pos += v; } else { y0 = ys(neg); y1 = ys(neg + v); neg += v; } }
        else { y0 = ys(Math.max(v, 0)); y1 = ys(Math.min(v, 0)); }
        const x = xs(i) - bw / 2 + (cfg.stacked ? 0 : j * ew);
        const col = s.colorAt ? s.colorAt(i, v) : s.color;
        g += `<rect x="${x.toFixed(1)}" y="${y0.toFixed(1)}" width="${Math.max(ew - 1, 1).toFixed(1)}" height="${Math.max(y1 - y0, 0.5).toFixed(1)}" fill="${col}" ${s.hatchFrom != null && i >= s.hatchFrom ? 'opacity=".45"' : ''}/>`;
      });
    }
  }
  // 선

function dotPlot(host) {
  const rates = [...new Set([...B.dots.may, ...B.dots.aug].filter((d) => d.n > 0).map((d) => d.rate))].sort((a, b) => b - a);
  const lo = Math.min(...rates) - 0.25, hi = Math.max(...rates) + 0.25;
  const levels = []; for (let r = hi; r >= lo - 1e-9; r -= 0.25) levels.push(+r.toFixed(2));
  const W = Math.max(460, host.clientWidth - 2 || 520), rowH = 26, m = { t: 26, l: 64, r: 16 }, H = m.t + levels.length * rowH + 10;
  const maxN = Math.max(...B.dots.may.map((d) => d.n), ...B.dots.aug.map((d) => d.n), 1), pw = W - m.l - m.r, unit = pw / maxN;
  const get = (arr, r) => (arr.find((d) => d.rate === r) || { n: 0 }).n;
  let g = `<text class="ax" x="${m.l}" y="14"><tspan fill="${C.gray}">■</tspan> 5월 회의(당시 2.50%)   <tspan fill="${C.red}">■</tspan> 8월 회의(당시 3.00%) — 막대 길이 = 점 개수</text>`;
  levels.forEach((r, i) => {
    const y = m.t + i * rowH; const a = get(B.dots.may, r), b = get(B.dots.aug, r);
    g += `<text class="ax" x="${m.l - 8}" y="${y + 16}" text-anchor="end">${fmt(r, 2)}%</text><line class="grid" x1="${m.l}" x2="${W - m.r}" y1="${y + rowH - 1}" y2="${y + rowH - 1}"/>`;
    g += `<rect class="db" data-t="5월" data-r="${r}" data-n="${a}" x="${m.l}" y="${y + 3}" width="${(a * unit).toFixed(1)}" height="9" fill="${C.gray}"/>`;
    g += `<rect class="db" data-t="8월" data-r="${r}" data-n="${b}" x="${m.l}" y="${y + 13}" width="${(b * unit).toFixed(1)}" height="9" fill="${C.red}"/>`;
    if (a) g += `<text class="bl" x="${(m.l + a * unit + 4).toFixed(1)}" y="${y + 11}">${a}</text>`;
    if (b) g += `<text class="bl" x="${(m.l + b * unit + 4).toFixed(1)}" y="${y + 21}">${b}</text>`;
  });
  host.innerHTML = `<div class="chart"><svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="조건부 금리전망 점도표">${g}</svg></div><div class="note">5월: 3.00% 10개·2.75% 7개·3.25% 2개·2.50% 2개 → 8월: 3.25% 10개·3.50% 6개·3.00% 5개. 8월 21개 점 중 16개가 현 수준(3.00%)보다 높다. (p.81)</div>`;
  $$('.db', host).forEach((r) => { const f = (e) => showTip(e.clientX, e.clientY, `<b>${r.dataset.t} 회의 · ${fmt(r.dataset.r, 2)}%</b><div>점 개수: <b>${r.dataset.n}</b> / 21</div>`); r.addEventListener('mousemove', f); r.addEventListener('mouseleave', hideTip); r.addEventListener('touchstart', (e) => f(e.touches[0]), { passive: true }); });
  REG.set(host, () => dotPlot(host));
}
